<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Classification Result</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 700px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.85;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .section {
            margin-bottom: 28px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #764ba2;
            margin-bottom: 10px;
        }

        .input-box {
            background: #f7f6fb;
            border: 1px solid #e5e0f0;
            border-radius: 10px;
            padding: 16px 18px;
            font-size: 16px;
            color: #333;
            line-height: 1.5;
        }

        .topics-box {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .topic-pill {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
        }

        .back-btn {
            display: inline-block;
            margin-top: 32px;
            width: 100%;
            text-align: center;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.4);
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="header">
            <h1>🎯 Classification Result</h1>
            <p>Here's what our model found in your course description</p>
        </div>

        <div class="card">
            <div class="section">
                <label>Input Text</label>
                <div class="input-box">{{ input_text }}</div>
            </div>

            <div class="section">
                <label>Predicted Topics</label>
                <div class="topics-box">
                    {% for topic in output_text.split(', ') %}
                        <span class="topic-pill">{{ topic }}</span>
                    {% endfor %}
                </div>
            </div>

            <a href="/" class="back-btn">← Classify Another Description</a>
        </div>
    </div>
</body>

</html>
